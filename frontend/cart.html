<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
</head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

  <!-- ✅ ONLY THIS NAVBAR -->
  <div id="navbar"></div>

  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });
  </script>

  <!-- ❌ REMOVED OLD NAVBAR (this was causing double navbar) -->


  <!-- CART -->
  <div class="cart-container">

    <!-- LEFT -->
    <div>
      <div id="cartItems" class="cart-items"></div>

      <!-- ✅ RECOMMENDED -->
      <h2 class="section-title" style="margin-top:40px;">You may also like</h2>
      <div id="recommended" class="recommended-list"></div>
    </div>

    <!-- RIGHT -->
    <div class="cart-summary">
      <h2>Order Summary</h2>

      <p>Total: ₹<span id="cartTotal">0</span></p>

      <button onclick="goToCheckout()">Proceed to Checkout</button>
    </div>

  </div>

  <script src="script.js"></script>

  <script>
  // ===== LOAD RECOMMENDED =====
  fetch(`${API_URL}/api/products`)
  .then(res => res.json())
  .then(data => {

    const container = document.getElementById("recommended");
    if (!container) return;

    container.innerHTML = "";

    // 🛒 get cart
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    // ❌ remove products already in cart
    const filtered = data.filter(p => 
      !cart.some(c => c._id === p._id)
    );

    // 🎯 take 4 from remaining
    filtered.slice(0,4).forEach(p => {
      container.innerHTML += `
    <div class="card">

      <img src="${getImageUrl(p.image)}" onclick="goToProduct('${p._id}')">

      <h3>${p.name}</h3>
      <p class="price">₹${p.price}</p>

      <button class="add-btn" onclick="addToCartFromCard(event, '${p._id}')">
        Add to Cart
      </button>

    </div>
  `;
    });

  });

  function addToCartFromCard(event, id) {
    event.stopPropagation();

    fetch(`${API_URL}/api/products`)
      .then(res => res.json())
      .then(data => {
        const product = data.find(p => p._id === id);
        if (product) addToCart(product);
      });
  }

  // NAV
  function goToProduct(id){
    window.location.href = "product.html?id=" + id;
  }
  </script>

<footer class="footer">
  <div class="footer-links">
    <a href="terms.html">Terms & Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="refund.html">Refund & Cancellation</a>
    <a href="shipping.html">Shipping Policy</a>
  </div>
</footer>

</body>
</html>
