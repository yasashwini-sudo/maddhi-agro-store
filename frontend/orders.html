<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="navbar"></div>

<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;
    });
</script>


<h1 class="section-title">My Orders</h1>

<div id="ordersContainer" style="max-width:800px;margin:40px auto;"></div>

<script src="script.js"></script>

<script>

async function loadOrders() {

  const token = localStorage.getItem("token");

  // If not logged in → redirect
  if (!token) {
    alert("Please login first");
    window.location.href = "index.html";
    return;
  }

  try {

    // ✅ YOUR AUTHORIZATION FETCH (clean version)
    const res = await fetch(`${API_URL}/api/orders`, {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const orders = await res.json();

    console.log("ORDERS:", orders); // debug

    const container = document.getElementById("ordersContainer");

    if (!orders || orders.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>No orders yet</p>";
      return;
    }

    container.innerHTML = "";

    orders.forEach(order => {
      
      container.innerHTML += `
  <div class="order-card">

    <div class="order-header">

      <div>
        <p class="order-name">${order.name}</p>
        <p class="order-phone">📞 ${order.phone}</p>
      </div>

      <div class="order-meta">
        <p class="order-total">₹${order.total}</p>
        <p class="payment-mode">
  ${
    order.payment === "UPI"
      ? "📱 UPI"
      : order.payment === "Card"
      ? "💳 Card"
      : "💵 Cash on Delivery"
  }
</p>

        <span class="status-badge ${order.status.toLowerCase()}">
          ${order.status}
        </span>

        <p class="order-date">
          ${new Date(order.date).toLocaleDateString()}
        </p>
      </div>

    </div>

    <div class="order-items">

      ${order.items.map(i => `
        <div class="order-item">
          <span>${i.name}</span>
          <span>x ${i.quantity}</span>
        </div>
      `).join("")}

    </div>

  </div>
`;

    });

  } catch (err) {
    console.error("Error loading orders:", err);
  }
}

// CART COUNT
function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let count = 0;
  cart.forEach(i => count += i.quantity);

  const el = document.getElementById("cartCount");
  if (el) el.innerText = count;
}

updateCartCount();
loadOrders();

</script>

<footer class="footer">
  <div class="footer-links">
    <a href="terms.html">Terms & Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="refund.html">Refund & Cancellation</a>
    <a href="shipping.html">Shipping Policy</a>
  </div>
</footer>
</body>
</html>
