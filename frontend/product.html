<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="navbar"></div>

  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });
  </script>
<!-- NAVBAR -->

<!-- PRODUCT SECTION -->
<div class="product-page">

  <div class="product-left">
    <img id="productImage">
  </div>

  <div class="product-right">

    <h1 id="productName"></h1>

    <p class="price" id="productPrice"></p>

    <p class="unit" id="productUnit"></p>

    <!-- ❌ REMOVED OBJECT PRINT ISSUE -->
    <p id="productDesc"></p>

    <ul style="margin-top:15px; color:#555; font-size:14px;">
      <li>✔ 100% Natural & Chemical Free</li>
      <li>✔ Directly sourced from farms</li>
      <li>✔ Retains nutrients & antioxidants</li>
    </ul>

    <button onclick="addToCart(currentProduct)">Add to Cart</button>
    <button onclick="buyNow(currentProduct)">Buy Now</button>

  </div>

</div>

<!-- WHY SECTION -->
<!-- WHY SECTION -->
<div class="product-why">

  <h2 class="why-title">Why choose this product?</h2>

  <div class="why-content">
    <div id="whyText"></div>
  </div>

</div>

<!-- RECOMMENDED -->
<h2 class="section-title" style="margin-top:80px;">
  You may also like
</h2>

<div class="products" id="recommended"></div>

<script src="script.js"></script>

<script>

  // ✅ GLOBAL API URL
  
  let currentProduct = null;
  
  // GET PRODUCT ID FROM URL
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  
  // FETCH PRODUCTS
  fetch(`${API_URL}/api/products`)
  .then(res => res.json())
  .then(data => {
  
    const product = data.find(p => p._id === id);
  
    if (!product) {
      document.body.innerHTML = "<h2 style='text-align:center;'>Product not found</h2>";
      return;
    }
  
    currentProduct = product;
  
    // MAIN PRODUCT
    document.getElementById("productImage").src =
      `${API_URL}/uploads/${product.image}`;
  
    document.getElementById("productName").innerText = product.name;
    document.getElementById("productPrice").innerText = "₹" + product.price;
    // ✅ SET UNIT (Litre / Kg)
// ✅ SET UNIT (Litre / Kg)
let category = (product.category || "").toLowerCase().trim();

let unitText = "";

if (category === "oil" || category === "ghee") {
  unitText = "1 Liter";
} 
else if (category === "salt") {
  unitText = "1.5 Kg";
} 
else {
  unitText = "1 Kg";
}

document.getElementById("productUnit").innerText = unitText;

document.getElementById("productUnit").innerText = unitText;
  
    // ✅ SHOW DESCRIPTION (TOP)
    document.getElementById("productDesc").innerText =
      product.description?.overview || "";
  
    // ✅ WHY SECTION (ONLY ONCE)
    document.getElementById("whyText").innerHTML = `
      <p>${product.description?.overview || ""}</p>
  
      <ul>
        ${product.description?.benefits?.map(b => `<li>${b}</li>`).join("") || ""}
      </ul>
    `;
  
    // RECOMMENDED PRODUCTS
    const related = data.filter(p =>
      p.category === product.category && p._id !== product._id
    );
  
    const container = document.getElementById("recommended");
    container.innerHTML = "";
  
    related.forEach(p => {
      container.innerHTML += `
        <div class="card" onclick="goToProduct('${p._id}')">
          <img src="${API_URL}/uploads/${p.image}">
          <h3>${p.name}</h3>
  
          <p style="font-size:13px;color:#666;">
            ${p.description?.overview?.substring(0, 50) || ""}...
          </p>
  
          <p class="price">₹${p.price}</p>
        </div>
      `;
    });
  
  })
  .catch(err => {
    console.error("Error loading product:", err);
  });
  
  
  // NAVIGATION
  function goToProduct(id) {
    window.location.href = "product.html?id=" + id;
  }
  
  
  // CART COUNT
  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
  
    let total = 0;
    cart.forEach(item => total += item.quantity);
  
    const el = document.getElementById("cartCount");
    if (el) el.innerText = total;
  }
  
  updateCartCount();
  
  </script>

<footer class="footer">
  <div class="footer-links">
    <a href="terms.html">Terms & Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="refund.html">Refund & Cancellation</a>
    <a href="shipping.html">Shipping Policy</a>
  </div>
</footer>
</body>
</html>
